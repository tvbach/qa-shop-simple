name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-shop:
    name: QA Shop · typecheck, unit/integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: qa-shop-tests · API + UI (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_SHOP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build & start QA Shop
        working-directory: qa-shop
        env:
          RATE_LIMIT: "off"
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          nohup npm start -- -p 3000 > ../qa-shop.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "QA Shop không khởi động được"; cat ../qa-shop.log; exit 1

      - name: Install test dependencies
        working-directory: qa-shop-tests
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium

      - name: Typecheck tests
        working-directory: qa-shop-tests
        run: npm run typecheck

      - name: Run Playwright
        working-directory: qa-shop-tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-shop-tests/playwright-report/
          retention-days: 7

      - name: QA Shop server log
        if: ${{ failure() }}
        run: cat qa-shop.log

  docker:
    name: Docker image builds and serves /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t qa-shop:ci qa-shop
      - name: Smoke test container
        run: |
          docker run -d --name qa-shop -p 3000:3000 qa-shop:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs qa-shop; exit 1
